[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "functionalpython"
version = "0.1.0"
description = "Small, tested examples of functional programming in Python"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["functional-programming", "examples", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]

[tool.setuptools]
packages = ["functionalpython"]
